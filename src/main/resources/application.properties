# =================================================
# CONFIGURAO PADRO (PARA PRODUO NO GOOGLE CLOUD)
# =================================================
quarkus.funqy.export=scheduledReport

# --- Configurao para Cloud Run ---
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# --- Configurao do Banco de Dados com Cloud SQL Auth Proxy (Seguro) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=application

# --- Configuração de Diagnóstico ---
# Força o log em modo DEBUG para obtermos mais informações sobre a falha.
quarkus.log.level=DEBUG
# Define explicitamente o ID do projeto para evitar falhas de descoberta.
quarkus.google.cloud.project-id=neon-trilogy-479114-v8

pubsub.topic.name=topic-email-sender

# Busca a senha diretamente do Google Secret Manager.
# Substitua 'NOME_DA_SUA_SECRET' pelo nome da secret que você criou.
quarkus.datasource.password=${DB_PASSWORD}

# Conexão Segura via Cloud SQL
quarkus.datasource.jdbc.url=jdbc:postgresql://34.39.226.182:5432/postech-fiap-tcf4

#
#quarkus.datasource.cloud-sql.instance-connection-name=neon-trilogy-479114-v8:southamerica-east1:postech-fiap-tcf4-project
quarkus.datasource.cloud-sql.database-name=postech-fiap-tcf4
quarkus.datasource.jdbc.driver=org.postgresql.Driver

# --- Configurao do Hibernate com Panache ---
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true

quarkus.native.enable-ssl=true

# Native-image additional build args (indexed) to control class initialization and enable HTTP/HTTPS
quarkus.native.additional-build-args[0]=--enable-http
quarkus.native.additional-build-args[1]=--enable-https
# A opo --enable-all-security-services est obsoleta, mas mantida por enquanto
quarkus.native.additional-build-args[2]=--enable-all-security-services

# --- Google Cloud & Auth ---
quarkus.native.additional-build-args[3]=--initialize-at-run-time=com.google.auth.oauth2.GoogleCredentials
quarkus.native.additional-build-args[4]=--initialize-at-run-time=com.google.cloud.pubsub.v1.Publisher
quarkus.native.additional-build-args[5]=--initialize-at-run-time=com.google.api.gax.core.GoogleCredentialsProvider
quarkus.native.additional-build-args[6]=--initialize-at-build-time=com.google.api.gax.core.AutoValue_InstantiatingExecutorProvider

# --- OpenTelemetry ---
quarkus.native.additional-build-args[7]=--initialize-at-run-time=io.opentelemetry.sdk.internal.AndroidFriendlyRandomHolder

# --- Narayana JTA (Transaction Manager) ---
quarkus.native.additional-build-args[8]=--initialize-at-run-time=com.arjuna.ats.internal.arjuna.recovery.PeriodicRecovery
quarkus.native.additional-build-args[9]=--initialize-at-run-time=com.arjuna.ats.internal.arjuna.recovery.ExpiredEntryMonitor
quarkus.native.additional-build-args[10]=--initialize-at-run-time=com.arjuna.ats.arjuna.recovery.RecoveryManager

# --- Netty, gRPC & Vert.x (Abordagem Abrangente) ---
quarkus.native.additional-build-args[11]=--initialize-at-run-time=io.netty.handler.codec.http
quarkus.native.additional-build-args[12]=--initialize-at-run-time=io.vertx.core.http.impl
quarkus.native.additional-build-args[13]=--initialize-at-run-time=io.grpc.netty.Utils
quarkus.native.additional-build-args[14]=--initialize-at-run-time=io.netty.handler.codec.compression.ZstdConstants

# Correo para os 33 erros de mtodos no suportados
quarkus.native.additional-build-args[15]=--initialize-at-run-time=io.netty.handler.codec.http.HttpVersion
quarkus.native.additional-build-args[16]=--initialize-at-run-time=io.netty.handler.codec.http.HttpResponseStatus

# Classes de cabealho HTTP que tambm podem causar vazamentos
quarkus.native.additional-build-args[17]=--initialize-at-run-time=io.netty.handler.codec.http.HttpHeaderValues
quarkus.native.additional-build-args[18]=--initialize-at-run-time=io.netty.handler.codec.http.HttpHeaderNames

# Classe de esquema HTTP identificada no ltimo erro
quarkus.native.additional-build-args[19]=--initialize-at-run-time=io.netty.handler.codec.http.HttpScheme

# Classe utilitria HTTP identificada no ltimo erro
quarkus.native.additional-build-args[20]=--initialize-at-run-time=io.netty.handler.codec.http.HttpUtil

# Classe de status HTTP identificada no ltimo erro
quarkus.native.additional-build-args[21]=--initialize-at-run-time=io.netty.handler.codec.http.HttpStatusClass

# Classes de compresso HTTP identificadas no ltimo erro
quarkus.native.additional-build-args[22]=--initialize-at-run-time=io.netty.handler.codec.http.HttpContentCompressor
quarkus.native.additional-build-args[23]=--initialize-at-run-time=io.netty.handler.codec.http.HttpContentEncoder

quarkus.native.additional-build-args[24]=--initialize-at-run-time=io.quarkus.vertx.http.runtime.VertxHttpRecorder

quarkus.native.additional-build-args[25]=--initialize-at-build-time=io.netty.handler.codec.http.HttpMethod
quarkus.native.additional-build-args[26]=--initialize-at-build-time=io.netty.handler.codec.http.HttpMethod$EnumNameMap
quarkus.native.additional-build-args[27]=--initialize-at-build-time=io.netty.handler.codec.http.HttpMethod$EnumNameMap$Node

quarkus.native.additional-build-args[28]=--initialize-at-run-time=com.google.common.cache

# Revertendo para run-time para evitar conflito com a lib Netty
quarkus.native.additional-build-args[29]=--initialize-at-run-time=io.netty.buffer.PooledByteBufAllocator
quarkus.native.additional-build-args[30]=--initialize-at-run-time=io.netty.buffer.UnpooledByteBufAllocator

# Adicionando classes do Vert.x que instanciam os alocadores, para serem inicializadas em run-time
quarkus.native.additional-build-args[31]=--initialize-at-run-time=io.vertx.core.buffer.impl.VertxByteBufAllocator
quarkus.native.additional-build-args[32]=--initialize-at-run-time=io.vertx.core.buffer.impl.PartialPooledByteBufAllocator

# --- Correção para Log4j2 no gRPC Shaded Netty ---
# Força o uso do JDK Logger para evitar a busca por classes do Log4j2 que não existem
quarkus.native.additional-build-args[33]=-Dio.grpc.netty.shaded.io.netty.noPreferDirect=true
quarkus.native.additional-build-args[34]=-Dio.grpc.netty.shaded.io.netty.util.internal.logging.InternalLoggerFactory=io.grpc.netty.shaded.io.netty.util.internal.logging.JdkLoggerFactory


# dev
%dev.quarkus.funqy.export=scheduledReport

%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=application
%dev.quarkus.datasource.password=${DB_PASSWORD}

%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://34.39.226.182:5432/postech-fiap-tcf4

%dev.quarkus.hibernate-orm.database.generation=none
#%dev.quarkus.hibernate-orm.log.sql=true
