# =================================================
# CONFIGURAÇÃO PADRÃO (PARA PRODUÇÃO NO GOOGLE CLOUD)
# =================================================
quarkus.funqy.export=scheduledReport

# --- Configuração para Cloud Run ---
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# --- Configuração do Banco de Dados com Cloud SQL Auth Proxy (Seguro) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:application}

# --- Configuração de Diagnóstico ---
# Força o log em modo DEBUG para obtermos mais informações sobre a falha.
quarkus.log.level=INFO
# Define explicitamente o ID do projeto para evitar falhas de descoberta.
quarkus.google.cloud.project-id=${GCP_PROJECT_ID:neon-trilogy-479114-v8}
# Configuração do projeto GCP para PubSub
gcp.project-id=${GCP_PROJECT_ID:neon-trilogy-479114-v8}

# Busca a senha do Google Secret Manager ou variável de ambiente
quarkus.datasource.password=${DB_PASSWORD}

# Conexão Segura via Cloud SQL usando connection name
quarkus.datasource.jdbc.url=jdbc:postgresql:///${DB_NAME:postech-fiap-tcf4}?cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory

# Cloud SQL Configuration
quarkus.datasource.cloud-sql.instance-connection-name=${CLOUD_SQL_CONNECTION_NAME:neon-trilogy-479114-v8:southamerica-east1:postech-fiap-tcf4-project}
quarkus.datasource.cloud-sql.database-name=${DB_NAME:postech-fiap-tcf4}
quarkus.datasource.jdbc.driver=org.postgresql.Driver

# --- Configuração do Hibernate com Panache ---
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true

quarkus.native.enable-ssl=true

# =================================================
# PERFIL DE DESENVOLVIMENTO (PARA RODAR LOCALMENTE)
# Ativado com: mvn quarkus:dev
# =================================================
%dev.quarkus.funqy.export=scheduledReport

# --- Configuração do Banco de Dados para Docker Local ---
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=application
%dev.quarkus.datasource.password=l4rQ}5`~]]{f+M{$

# URL JDBC para conectar ao PostgreSQL rodando em Docker na porta padrão.
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://34.39.226.182:5432/postech-fiap-tcf4

# --- Configuração do Hibernate para Dev ---
%dev.quarkus.hibernate-orm.database.generation=none
